<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */

      #basic-layout-9 {
        display: grid;
        grid-gap: 10px;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: 200px 600px 100px;
      }


      .header {
        grid-column: 1 / 2;
      }



      .nav {
        grid-column: 2 / 3;
    
      }

      .a-123 {
        text-align: center;
        margin-top: 85px;
      }

      .a1, .a2, .a3 {
        border: 1px solid gray;
        border-radius: 10px;
        padding: 10px;
        background-color: white;
        
      }


      .content {
        grid-column: 1 / 3;
      }
      


      .footer {
        grid-column: 1 / -1;
        color: white;
      }

    </style>

  </head>


  <body id="basic-layout-9">
    <header class="header"><h1>Basic Layout 9</h1></header>
      <nav class="nav">
        <div class= "a-123">
          <a class="a1" href="#">Home</a>
          <a class="a2" href="#">Over ons</a>
          <a class="a3" href="#">Contact</a>
        </div>
      </nav>
    <main class="content"><a href="../index.html">Terug naar het overzicht</a></main>
    <footer class="footer">Footer</footer>
  </body>
</html>
